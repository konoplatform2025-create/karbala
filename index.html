body{color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.arch{background:var(--navy);border-radius:999px 999px 28px 28px;margin-top:20px;padding:46px 28px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{background:var(--ivory);border-radius:50%;width:132px;height:132px;display:grid;place-items:center}
.logo img{width:96px;height:auto}
h1{font-family:var(--display);font-weight:700;color:#fff;font-size:1.45rem;line-height:1.45;margin:0;text-wrap:balance}
.sub{color:#D9E6F5;font-size:.95rem;margin:0}
.line{width:46px;height:3px;border-radius:3px;background:var(--blue)}
.links{display:flex;flex-direction:column;gap:12px}
.label{font-family:var(--display);font-weight:700;color:var(--muted);font-size:.9rem;margin:6px 4px 0}
a.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--sand);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
a.row:hover,a.row:focus-visible{border-color:var(--navy);transform:translateY(-1px)}
a.row:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--navy);display:grid;place-items:center}
.ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{display:flex;flex-direction:column;min-width:0;flex:1}
.t b{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.4}
.t span{color:var(--muted);font-size:.88rem;direction:ltr;text-align:right;unicode-bidi:plaintext}
.arr{flex:none;color:var(--blue);font-size:1.3rem}
.wa .ic{background:var(--blue)}
.wa .ic svg{stroke:var(--ink)}
footer{text-align:center;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){a.row{transition:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
